<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - SSO Meeting Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .slide-right { animation: slideRight 0.8s ease-out forwards; }
        .slide-left { animation: slideLeft 0.8s ease-out forwards; }
        @keyframes slideRight { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideLeft { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row bg-slate-50 relative overflow-hidden text-gray-800">

    <!-- Decorative Background Elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-emerald-200/20 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-teal-200/20 rounded-full blur-[100px]"></div>
    </div>

    <!-- Minh họa (Cột trái) -->
    <div class="hidden md:flex w-1/2 items-center justify-center p-10 z-10 slide-right">
        <img src="https://cdn.dribbble.com/userupload/20125976/file/original-667ec660862f67bdc1b849ddd5822829.gif" 
             alt="Meeting illustration" 
             class="w-4/5 max-w-2xl rounded-3xl shadow-2xl shadow-emerald-900/10 rotate-1 border-4 border-white/50 backdrop-blur-sm">
    </div>

    <!-- Form (Cột phải) -->
    <div class="flex w-full md:w-1/2 items-center justify-center p-6 z-10 slide-left">
        <div class="bg-white/80 backdrop-blur-xl shadow-2xl p-8 md:p-12 rounded-3xl w-full max-w-md border border-white/50 relative">
            
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-500 text-white shadow-lg shadow-emerald-500/30 mb-4">
                    <span class="text-2xl font-bold w-full text-center">6x6</span>
                </div>
                <h2 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-600 to-teal-600">
                    Meeting Management
                </h2>
                <p class="text-gray-500 mt-2 text-sm">Hệ thống Xác thực Tập trung (SSO)</p>
            </div>

            <!-- Error and Logout Messages -->
            <div th:if="${param.error}" class="mb-5 p-3.5 bg-red-50/80 border border-red-200 text-red-600 rounded-xl text-sm flex items-center gap-2">
                <i class="fas fa-exclamation-circle text-lg"></i>
                <span class="font-medium">Sai tài khoản hoặc mật khẩu. Vui lòng thử lại!</span>
            </div>

            <div th:if="${param.logout}" class="mb-5 p-3.5 bg-emerald-50/80 border border-teal-200 text-teal-700 rounded-xl text-sm flex items-center gap-2">
                <i class="fas fa-check-circle text-lg"></i>
                <span class="font-medium">Bạn đã đăng xuất thành công.</span>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-5">
                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5 ml-1">Email / Tài khoản</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-emerald-500 transition-colors">
                            <i class="fas fa-envelope text-lg"></i>
                        </div>
                        <input type="text" id="username" name="username" 
                               placeholder="name@example.com" 
                               required autofocus
                               class="w-full pl-11 pr-4 py-3.5 border border-gray-200 rounded-xl bg-gray-50/50 text-gray-800 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5 ml-1">Mật khẩu</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-emerald-500 transition-colors">
                            <i class="fas fa-lock text-lg"></i>
                        </div>
                        <input type="password" id="password" name="password" 
                               placeholder="••••••••" 
                               required
                               class="w-full pl-11 pr-12 py-3.5 border border-gray-200 rounded-xl bg-gray-50/50 text-gray-800 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all">
                        
                        <button type="button" onclick="togglePassword()" 
                                class="absolute right-3 top-0 h-full flex items-center px-1 text-gray-400 hover:text-emerald-600 transition-colors focus:outline-none">
                            <i id="eyeIcon" class="fas fa-eye text-lg"></i>
                        </button>
                    </div>

                    <div class="text-right mt-2">
                        <a href="javascript:void(0)" class="text-xs font-medium text-emerald-600 hover:text-emerald-700 hover:underline">Quên mật khẩu?</a>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/30 hover:shadow-emerald-500/40 hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2.5 active:scale-95 mt-6">
                    <i class="fas fa-sign-in-alt"></i>
                    Đăng nhập SSO
                </button>
            </form>

            <p class="text-xs text-center text-gray-400 mt-10">
                © 2026 GREENPOWER JSC. All rights reserved.
            </p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
